---
MY_NODES_ONLY: False #Set the Bot to only respond to a list of nodes for DM commands
CONTACT_REFRESH_INTERVAL: 120 # how often should the bot refresh it's local contact list
GATE_TO_MQTT: True # Gate packets out to MQTT
MQTT_SERVER: "XXX.XXX.XXX.XXX" #Host name or IP address of your MQTT server
MQTT_PORT: "1883" #Port of your MQTT Server
MQTT_USER: "username" #username for your MQTT server
MQTT_PASS: "password" #password for your MQTT server
MQTT_BASE_TOPIC: "MeshCore" #the bast topic for MQTT. Your nodes name and frequency will be appended to this.
PING_CHANNEL_NAMES: ["#ping"] #what channels should the bot respond to ping on? Can enter one or multiple comma separated
MY_LOCATION: "MeshLand" #the location the Bot will respond with
BANNED_PINGERS: ["Banned User 1", "Banned User 2"] #add users to the list to prevent ping responding to them. 


MY_NODES: #a list of public keys that DM commands respond to
  - "pubkey 1"
  - "pubkey 2"
